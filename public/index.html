<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Leads — Formatar Gestão</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      background-color: #f4f5f7;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #000;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      background-color: #ff3b00;
      color: #fff;
      padding: 10px 15px;
      font-weight: bold;
      font-size: 18px;
      border-radius: 4px;
      text-align: center;
    }

    .sub-brand {
      font-size: 11px;
      color: #aaa;
      letter-spacing: 1px;
      margin-top: -10px;
      text-align: center;
    }

    .menu-item {
      background-color: #ff3b00;
      color: #fff;
      padding: 12px 15px;
      border-radius: 6px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    /* Footer da Sidebar */
    .sidebar-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #777;
      border-top: 1px solid #222;
      padding-top: 15px;
    }

    .badge-version {
      background-color: #1a1a1a;
      color: #aaa;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
    }

    /* Content Area */
    .content {
      flex: 1;
      padding: 30px;
    }

    .header-tag {
      color: #ff3b00;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .header-title-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header-title {
      font-size: 28px;
      font-weight: bold;
    }

    .btn-add {
      background-color: #ff3b00;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: #e03400;
    }

    /* Table Container */
    .card {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .card-header {
      background-color: #000;
      color: #fff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #f8f9fa;
      color: #555;
      font-size: 12px;
      font-weight: bold;
      padding: 12px 20px;
      border-bottom: 1px solid #eee;
    }

    td {
      padding: 14px 20px;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }

    .lead-doc {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .modal-box h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      background-color: #fff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-save {
      background-color: #ff3b00;
      color: white;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-cancel {
      background-color: #ccc;
      color: #333;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="brand">FORMATAR</div>
      <div class="sub-brand">GESTÃO E GOVERNANÇA</div>
      <div class="menu-item">👥 Leads</div>
    </div>

    <!-- Rodapé da Sidebar -->
    <div class="sidebar-footer">
      <span>#EuSouFormataria</span>
      <span class="badge-version">v1.3 (Supabase)</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="header-tag">— MÓDULO DE CAPTAÇÃO</div>
    <div class="header-title-container">
      <h1 class="header-title">Leads</h1>
      <button class="btn-add" onclick="openModal()">+ Incluir Lead</button>
    </div>

    <!-- Leads Table Card -->
    <div class="card">
      <div class="card-header">
        <span>BASE SUPABASE EM TEMPO REAL</span>
        <span>Total de Registros: <strong id="totalRegistros">0</strong></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>NOME / DOCUMENTO</th>
            <th>WHATSAPP</th>
            <th>ORIGEM</th>
            <th>DATA/HORA</th>
          </tr>
        </thead>
        <tbody id="tabelaLeads">
          <tr>
            <td colspan="4" style="text-align: center; color: #777;">Carregando registros...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Cadastro de Lead -->
  <div class="modal-overlay" id="modalLead">
    <div class="modal-box">
      <h2>Incluir Novo Lead</h2>
      <div class="form-group">
        <label for="leadNome">Nome Completo</label>
        <input type="text" id="leadNome" placeholder="Ex: João Silva">
      </div>
      <div class="form-group">
        <label for="leadDocumento">CPF / CNPJ</label>
        <input type="text" id="leadDocumento" placeholder="Ex: 000.000.000-00 ou 00.000.000/0001-00">
      </div>
      <div class="form-group">
        <label for="leadWhatsapp">WhatsApp</label>
        <input type="text" id="leadWhatsapp" placeholder="Ex: (31) 99999-9999">
      </div>
      <div class="form-group">
        <label for="leadOrigem">Origem</label>
        <select id="leadOrigem">
          <option value="">Selecione uma opção...</option>
          <option value="eventos">eventos</option>
          <option value="Inbound">Inbound</option>
          <option value="outbound">outbound</option>
          <option value="redes">redes</option>
          <option value="tráfego pago">tráfego pago</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="salvarLead()">Salvar Lead</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://lvcrttnklojyvfhzszkn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_a6cAxCqWYD2gqvLbyj3MIg_Z6n8x3HR';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Funções do Modal
    function openModal() {
      document.getElementById('modalLead').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalLead').style.display = 'none';
      document.getElementById('leadNome').value = '';
      document.getElementById('leadDocumento').value = '';
      document.getElementById('leadWhatsapp').value = '';
      document.getElementById('leadOrigem').value = '';
    }

    // Alias para compatibilidade
    function abrirModalLead() { openModal(); }
    function fecharModalLead() { closeModal(); }

    // Buscar Leads no Supabase
    async function carregarLeads() {
      const { data, error } = await supabaseClient
        .from('leads')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Erro ao buscar leads:', error.message);
        return;
      }

      const tbody = document.getElementById('tabelaLeads');
      document.getElementById('totalRegistros').innerText = data ? data.length : 0;

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum lead encontrado.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(lead => `
        <tr>
          <td>
            <strong>${lead.nome || 'N/I'}</strong>
            ${lead.documento ? `<div class="lead-doc">Doc: ${lead.documento}</div>` : ''}
          </td>
          <td>${lead.whatsapp || 'N/I'}</td>
          <td>${lead.origem || 'Direto'}</td>
          <td>${lead.created_at ? new Date(lead.created_at).toLocaleString('pt-BR') : '-'}</td>
        </tr>
      `).join('');
    }

    // Cadastrar Lead
    async function salvarLead() {
      const nome = document.getElementById('leadNome').value.trim();
      const documento = document.getElementById('leadDocumento').value.trim();
      const whatsapp = document.getElementById('leadWhatsapp').value.trim();
      const origem = document.getElementById('leadOrigem').value;

      if (!nome) {
        alert('Por favor, informe o nome do lead.');
        return;
      }

      if (!origem) {
        alert('Por favor, selecione a origem do lead.');
        return;
      }

      const { data, error } = await supabaseClient
        .from('leads')
        .insert([{ nome, documento, whatsapp, origem }]);

      if (error) {
        alert('Erro ao salvar no Supabase: ' + error.message);
      } else {
        closeModal();
        carregarLeads();
      }
    }

    // Inicialização
    carregarLeads();
  </script>
</body>
</html>
