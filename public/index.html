<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Leads — Formatar Gestão</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-body: #f4f5f7;
      --bg-card: #ffffff;
      --bg-header: #ffffff;
      --bg-sidebar: #000000;
      --text-main: #222222;
      --text-muted: #666666;
      --border-color: #eeeeee;
      --table-header-bg: #f8f9fa;
      --primary: #ff3b00;
      --primary-hover: #e03400;
    }

    [data-theme="dark"] {
      --bg-body: #121212;
      --bg-card: #1e1e1e;
      --bg-header: #1e1e1e;
      --bg-sidebar: #000000;
      --text-main: #f1f1f1;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --table-header-bg: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-top: 60px; /* Espaço para o cabeçalho fixo */
      transition: background-color 0.3s, color 0.3s;
    }

    /* Top Navbar Fixa */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1100;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .header-logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 32px;
      object-fit: contain;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover {
      border-color: var(--primary);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: calc(100vh - 60px);
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .menu-item {
      background-color: var(--primary);
      color: #fff;
      padding: 12px 15px;
      border-radius: 6px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .sidebar-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #777;
      border-top: 1px solid #222;
      padding-top: 15px;
    }

    .badge-version {
      background-color: #1a1a1a;
      color: #aaa;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
    }

    /* Content Area */
    .content {
      flex: 1;
      padding: 30px;
    }

    .header-tag {
      color: var(--primary);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .header-title-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header-title {
      font-size: 28px;
      font-weight: bold;
    }

    .btn-add {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: var(--primary-hover);
    }

    /* Table Container */
    .card {
      background-color: var(--bg-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .card-header {
      background-color: #000;
      color: #fff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: var(--table-header-bg);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: bold;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 14px 20px;
      font-size: 14px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      color: var(--text-main);
    }

    .lead-doc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Ações na Tabela */
    .actions-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-icon {
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .action-icon:hover {
      transform: scale(1.15);
    }

    .wsp-icon-svg {
      width: 20px;
      height: 20px;
      fill: #25D366;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 1200;
    }

    .modal-box {
      background: var(--bg-card);
      color: var(--text-main);
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
    }

    .modal-box h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      background-color: var(--bg-card);
      color: var(--text-main);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-save {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-cancel {
      background-color: #ccc;
      color: #333;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header Fixo -->
  <header class="top-header">
    <div class="header-logo-container">
      <img id="brandLogo" src="FORMATAR LOGO PRETA.png" alt="Formatar Gestão" class="brand-logo">
    </div>
    <div class="header-actions">
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">
        🌙 Modo Escuro
      </button>
      <div class="user-avatar" title="Usuário Logado">
        JT
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="menu-item">👥 Leads</div>
    </div>

    <div class="sidebar-footer">
      <span>#EuSouFormataria</span>
      <span class="badge-version">v1.6 (Supabase)</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="header-tag">— MÓDULO DE CAPTAÇÃO</div>
    <div class="header-title-container">
      <h1 class="header-title">Leads</h1>
      <button class="btn-add" onclick="openModal()">+ Incluir Lead</button>
    </div>

    <!-- Leads Table Card -->
    <div class="card">
      <div class="card-header">
        <span>BASE SUPABASE EM TEMPO REAL</span>
        <span>Total de Registros: <strong id="totalRegistros">0</strong></span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width: 110px;">AÇÕES</th>
            <th>NOME / DOCUMENTO</th>
            <th>WHATSAPP</th>
            <th>ORIGEM</th>
            <th>DATA/HORA</th>
          </tr>
        </thead>
        <tbody id="tabelaLeads">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando registros...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Cadastro/Edição de Lead -->
  <div class="modal-overlay" id="modalLead">
    <div class="modal-box">
      <h2 id="modalTitle">Incluir Novo Lead</h2>
      <input type="hidden" id="leadId">
      <div class="form-group">
        <label for="leadNome">Nome Completo</label>
        <input type="text" id="leadNome" placeholder="Ex: João Silva">
      </div>
      <div class="form-group">
        <label for="leadDocumento">CPF / CNPJ</label>
        <input type="text" id="leadDocumento" placeholder="Ex: 000.000.000-00 ou 00.000.000/0001-00">
      </div>
      <div class="form-group">
        <label for="leadWhatsapp">WhatsApp</label>
        <input type="text" id="leadWhatsapp" placeholder="Ex: (31) 99999-9999">
      </div>
      <div class="form-group">
        <label for="leadOrigem">Origem</label>
        <select id="leadOrigem">
          <option value="">Selecione uma opção...</option>
          <option value="eventos">eventos</option>
          <option value="Inbound">Inbound</option>
          <option value="outbound">outbound</option>
          <option value="redes">redes</option>
          <option value="tráfego pago">tráfego pago</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="salvarLead()">Salvar Lead</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://lvcrttnklojyvfhzszkn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_a6cAxCqWYD2gqvLbyj3MIg_Z6n8x3HR';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let leadsCache = [];

    // Alternador de Tema Dark / Light
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      html.setAttribute('data-theme', newTheme);
      
      const themeBtn = document.getElementById('themeBtn');
      const brandLogo = document.getElementById('brandLogo');

      if (newTheme === 'dark') {
        themeBtn.innerHTML = '☀️ Modo Claro';
        brandLogo.src = 'FORMATAR LOGO BRANCA.png';
      } else {
        themeBtn.innerHTML = '🌙 Modo Escuro';
        brandLogo.src = 'FORMATAR LOGO PRETA.png';
      }
    }

    // Modal
    function openModal(lead = null) {
      if (lead) {
        document.getElementById('modalTitle').innerText = 'Editar Lead';
        document.getElementById('leadId').value = lead.id;
        document.getElementById('leadNome').value = lead.nome || '';
        document.getElementById('leadDocumento').value = lead.documento || '';
        document.getElementById('leadWhatsapp').value = lead.whatsapp || '';
        document.getElementById('leadOrigem').value = lead.origem || '';
      } else {
        document.getElementById('modalTitle').innerText = 'Incluir Novo Lead';
        document.getElementById('leadId').value = '';
        document.getElementById('leadNome').value = '';
        document.getElementById('leadDocumento').value = '';
        document.getElementById('leadWhatsapp').value = '';
        document.getElementById('leadOrigem').value = '';
      }
      document.getElementById('modalLead').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalLead').style.display = 'none';
    }

    // Buscar Leads
    async function carregarLeads() {
      const { data, error } = await supabaseClient
        .from('leads')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Erro ao buscar leads:', error.message);
        return;
      }

      leadsCache = data || [];
      const tbody = document.getElementById('tabelaLeads');
      document.getElementById('totalRegistros').innerText = leadsCache.length;

      if (leadsCache.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Nenhum lead encontrado.</td></tr>';
        return;
      }

      const svgWhatsapp = `<svg class="wsp-icon-svg" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>`;

      tbody.innerHTML = leadsCache.map(lead => {
        const numLimpo = (lead.whatsapp || '').replace(/\D/g, '');
        const wspUrl = numLimpo ? `https://wa.me/55${numLimpo}` : '#';

        return `
          <tr>
            <td>
              <div class="actions-container">
                ${numLimpo ? `
                  <a href="${wspUrl}" target="_blank" class="action-icon" title="Conversar no WhatsApp">
                    ${svgWhatsapp}
                  </a>
                ` : '<span class="action-icon" style="opacity:0.3;" title="Sem número">💬</span>'}
                <button class="action-icon" onclick="editarLead('${lead.id}')" title="Editar">✏️</button>
                <button class="action-icon" onclick="excluirLead('${lead.id}')" title="Excluir">🗑️</button>
              </div>
            </td>
            <td>
              <strong>${lead.nome || 'N/I'}</strong>
              ${lead.documento ? `<div class="lead-doc">Doc: ${lead.documento}</div>` : ''}
            </td>
            <td>${lead.whatsapp || 'N/I'}</td>
            <td>${lead.origem || 'Direto'}</td>
            <td>${lead.created_at ? new Date(lead.created_at).toLocaleString('pt-BR') : '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function editarLead(id) {
      const lead = leadsCache.find(item => item.id == id);
      if (lead) openModal(lead);
    }

    async function excluirLead(id) {
      if (confirm('Tem certeza que deseja excluir este lead?')) {
        const { error } = await supabaseClient.from('leads').delete().eq('id', id);
        if (error) {
          alert('Erro ao excluir: ' + error.message);
        } else {
          carregarLeads();
        }
      }
    }

    // Salvar Lead
    async function salvarLead() {
      const id = document.getElementById('leadId').value;
      const nome = document.getElementById('leadNome').value.trim();
      const documento = document.getElementById('leadDocumento').value.trim();
      const whatsapp = document.getElementById('leadWhatsapp').value.trim();
      const origem = document.getElementById('leadOrigem').value;

      if (!nome) {
        alert('Por favor, informe o nome do lead.');
        return;
      }

      if (!origem) {
        alert('Por favor, selecione a origem do lead.');
        return;
      }

      let res;
      if (id) {
        res = await supabaseClient
          .from('leads')
          .update({ nome, documento, whatsapp, origem })
          .eq('id', id);
      } else {
        res = await supabaseClient
          .from('leads')
          .insert([{ nome, documento, whatsapp, origem }]);
      }

      if (res.error) {
        alert('Erro ao salvar no Supabase: ' + res.error.message);
      } else {
        closeModal();
        carregarLeads();
      }
    }

    // Inicialização
    carregarLeads();
  </script>
</body>
</html>
